<script type="text/babel">
const { Dialog, Button } = window.MahinDesignSystem_5e3929;

function useReveal(dep) {
  React.useEffect(() => {
    const els = document.querySelectorAll(".reveal:not(.in)");
    const io = new IntersectionObserver((es) => es.forEach((e, n) => {
      if (e.isIntersecting) { e.target.style.transitionDelay = (n * 70) + "ms"; e.target.classList.add("in"); io.unobserve(e.target); }
    }), { rootMargin: "-8% 0px" });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, [dep]);
}

function App() {
  const [view, setView] = React.useState({ name: "home" });
  const [sent, setSent] = React.useState(false);
  useReveal(view.name);
  const navigate = (id) => {
    if (view.name !== "home") { setView({ name: "home" }); setTimeout(() => document.getElementById(id) && window.scrollTo({ top: document.getElementById(id).offsetTop - 72, behavior: "smooth" }), 60); return; }
    const el = document.getElementById(id);
    if (el) window.scrollTo({ top: id === "top" ? 0 : el.offsetTop - 72, behavior: "smooth" });
  };
  const openCase = (p) => { setView({ name: "case", project: p }); window.scrollTo({ top: 0 }); };
  return (
    <>
      <window.Nav onNavigate={navigate} active={view.name === "case" ? "work" : null} />
      {view.name === "home" ? (
        <main>
          <window.Hero onNavigate={navigate} />
          <div className="reveal"><window.About /></div>
          <div className="reveal"><window.Services /></div>
          <div className="reveal"><window.Work onOpenCase={openCase} /></div>
          <div className="reveal"><window.Process /></div>
          <div className="reveal"><window.Results /></div>
          <div className="reveal"><window.Contact onSubmit={() => setSent(true)} /></div>
        </main>
      ) : (
        <main><window.CaseStudy project={view.project} onBack={() => { setView({ name: "home" }); setTimeout(() => navigate("work"), 40); }} /></main>
      )}
      <window.Footer onNavigate={navigate} />
      <Dialog open={sent} title="Enquiry sent" onClose={() => setSent(false)} footer={<Button size="sm" onClick={() => setSent(false)}>Done</Button>}>
        Thanks — I reply within one working day. This is a demo form; wire it to your own endpoint before launch.
      </Dialog>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
