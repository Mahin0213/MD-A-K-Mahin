<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg-page);font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--paper-100)}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div class="sw"><div style="background:var(--paper-100);color:var(--ink-1000)">paper-100 / #F5F4EF</div><div style="background:var(--paper-90);color:var(--ink-1000)">paper-90 / #E8E7E0</div><div style="background:var(--paper-70);color:var(--ink-1000)">paper-70 / #C9C8C1</div><div style="background:var(--ink-300);color:var(--ink-1000)">ink-300 / #8A8A96</div></div><div class="lbl" style="margin-top:12px">--text-strong · --text-body · --text-muted</div></body></html>
