<!-- @dsCard group="Colors" viewport="700x150" name="Text roles on dark" subtitle="Four levels of emphasis, no fifth" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg-page);font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--paper-100)}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div style="display:flex;flex-direction:column;gap:9px"><div style="display:flex;gap:18px;align-items:baseline"><span class="lbl" style="width:120px">--text-strong</span><span style="color:var(--text-strong);font-size:15px">Headlines and key statements</span></div><div style="display:flex;gap:18px;align-items:baseline"><span class="lbl" style="width:120px">--text-body</span><span style="color:var(--text-body);font-size:15px">Body copy and supporting paragraphs</span></div><div style="display:flex;gap:18px;align-items:baseline"><span class="lbl" style="width:120px">--text-muted</span><span style="color:var(--text-muted);font-size:15px">Labels, metadata, captions</span></div><div style="display:flex;gap:18px;align-items:baseline"><span class="lbl" style="width:120px">--text-faint</span><span style="color:var(--text-faint);font-size:15px">Row numbers, disabled, ghost detail</span></div><div style="display:flex;gap:18px;align-items:baseline"><span class="lbl" style="width:120px">--text-accent</span><span style="color:var(--text-accent);font-size:15px">One highlighted phrase per section</span></div></div></body></html>
