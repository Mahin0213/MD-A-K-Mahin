<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg-page);font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--paper-100)}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div style="display:flex;gap:14px;align-items:center"><div style="text-align:center"><div style="width:76px;height:44px;border:1px solid var(--border-strong);border-radius:0"></div><div class="lbl" style="margin-top:6px">--radius-0</div></div><div style="text-align:center"><div style="width:76px;height:44px;border:1px solid var(--border-strong);border-radius:2px"></div><div class="lbl" style="margin-top:6px">--radius-1</div></div><div style="text-align:center"><div style="width:76px;height:44px;border:1px solid var(--border-strong);border-radius:4px"></div><div class="lbl" style="margin-top:6px">--radius-2</div></div><div style="text-align:center"><div style="width:76px;height:44px;border:1px solid var(--border-strong);border-radius:8px"></div><div class="lbl" style="margin-top:6px">--radius-3</div></div><div style="text-align:center"><div style="width:96px;height:30px;border:1px solid var(--accent);border-radius:999px"></div><div class="lbl" style="margin-top:6px">--radius-pill</div></div></div></body></html>
