<!-- @dsCard group="Brand" viewport="700x160" name="Hairlines, not shadows" subtitle="Structure comes from 1px rules and value shifts" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg-page);font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--paper-100)}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px"><div><hr style="border:0;border-top:1px solid var(--border-hairline);margin:0 0 8px"><div class="lbl">--border-hairline · #2A2A31</div><hr style="border:0;border-top:1px solid var(--border-soft);margin:16px 0 8px"><div class="lbl">--border-soft · 9% paper</div><hr style="border:0;border-top:1px solid var(--accent);margin:16px 0 8px"><div class="lbl" style="color:var(--accent)">--border-accent · active row</div></div><div style="background:var(--surface-card);border:1px solid var(--border-soft);border-radius:4px;padding:16px"><div class="lbl">Card = surface shift + hairline</div><div style="color:var(--text-body);font-size:14px;margin-top:8px">No drop shadow. The only shadow in the system is --shadow-overlay, on modals.</div></div></div></body></html>
