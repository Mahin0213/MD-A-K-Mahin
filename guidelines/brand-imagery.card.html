<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg-page);font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--paper-100)}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;height:118px"><div style="position:relative;background:repeating-linear-gradient(135deg,var(--ink-800) 0 2px,var(--ink-900) 2px 12px);filter:var(--img-filter);border:1px solid var(--border-soft)"><span class="lbl" style="position:absolute;left:10px;bottom:8px">rest · grayscale(1) brightness(.86)</span></div><div style="position:relative;background:repeating-linear-gradient(135deg,var(--ink-700) 0 2px,var(--ink-800) 2px 12px);border:1px solid var(--border-strong);transform:scale(1.02)"><span class="lbl" style="position:absolute;left:10px;bottom:8px">hover · scale 1.04, colour returns</span></div></div></body></html>
