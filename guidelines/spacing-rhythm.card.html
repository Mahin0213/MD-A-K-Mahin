<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg-page);font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--paper-100)}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div style="border:1px dashed var(--ink-600);position:relative;padding:34px 40px"><div class="lbl" style="color:var(--accent)">01</div><hr style="border:0;border-top:1px solid var(--border-hairline);margin:12px 0 16px"><div style="font-family:var(--font-display);font-size:28px;color:var(--text-strong);letter-spacing:-.03em">Section title sits under the rule</div><div class="lbl" style="position:absolute;right:8px;top:8px">section-y clamp(84,11vw,180)</div><div class="lbl" style="position:absolute;left:8px;bottom:6px">gutter clamp(20,5vw,88)</div></div></body></html>
