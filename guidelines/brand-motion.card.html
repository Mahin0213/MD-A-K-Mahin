<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg-page);font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--paper-100)}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;gap:20px;align-items:baseline"><span class="lbl" style="width:170px;color:var(--accent)">--dur-fast 180ms</span><span style="color:var(--text-body);font-size:14px">hover, color, border</span></div><div style="display:flex;gap:20px;align-items:baseline"><span class="lbl" style="width:170px;color:var(--accent)">--dur-base 280ms</span><span style="color:var(--text-body);font-size:14px">transforms, row shift, image zoom</span></div><div style="display:flex;gap:20px;align-items:baseline"><span class="lbl" style="width:170px;color:var(--accent)">--dur-slow 520ms</span><span style="color:var(--text-body);font-size:14px">nav, overlay</span></div><div style="display:flex;gap:20px;align-items:baseline"><span class="lbl" style="width:170px;color:var(--accent)">--dur-reveal 820ms</span><span style="color:var(--text-body);font-size:14px">scroll reveal, 28px rise, 70ms stagger</span></div><div class="lbl" style="margin-top:4px">--ease-editorial cubic-bezier(.22,.61,.24,1) · --ease-out cubic-bezier(.16,1,.3,1)</div></div></body></html>
