<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg-page);font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--paper-100)}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div class="sw"><div style="background:var(--signal-ok);color:var(--ink-1000)">signal-ok</div><div style="background:var(--signal-warn);color:var(--ink-1000)">signal-warn</div><div style="background:var(--signal-err);color:var(--ink-1000)">signal-err</div></div><div class="lbl" style="margin-top:12px">Used for field validation and availability dots only</div></body></html>
