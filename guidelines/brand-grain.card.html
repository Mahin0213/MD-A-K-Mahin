<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg-page);font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--paper-100)}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;height:112px"><div style="position:relative;background:var(--ink-850);overflow:hidden"><div style="position:absolute;inset:0;background-image:var(--grain-url);opacity:.28;mix-blend-mode:screen"></div><div class="lbl" style="position:absolute;left:10px;bottom:8px">grain @ 6× for visibility (ships at .045)</div></div><div style="position:relative;background:repeating-linear-gradient(135deg,var(--ink-800) 0 2px,var(--ink-850) 2px 12px)"><div style="position:absolute;inset:0;background:var(--veil-scrim)"></div><div class="lbl" style="position:absolute;left:10px;bottom:8px">--veil-scrim over media</div></div></div></body></html>
